name: vastlint VAST Validator
author: Aleksander Sekowski
description: Validate VAST XML files in CI using vastlint
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: File, glob, or directory passed to `vastlint check`
    required: false
    default: tags/**/*.xml
  version:
    description: vastlint release tag (for example v0.11.1) or latest
    required: false
    default: latest
  fail-on-warning:
    description: Fail the action when warnings are present
    required: false
    default: "false"
  format:
    description: Optional output format (for example json)
    required: false
    default: ""
  extra-args:
    description: Additional args appended to `vastlint check` (space-separated)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install vastlint
      env:
        VASTLINT_ACTION_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -s)" in
          Linux)  os="linux" ;;
          Darwin) os="macos" ;;
          *)
            echo "Unsupported runner OS: $(uname -s)"
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch="x86_64" ;;
          arm64|aarch64) arch="aarch64" ;;
          *)
            echo "Unsupported runner architecture: $(uname -m)"
            exit 1
            ;;
        esac

        artifact="vastlint-${os}-${arch}.tar.gz"
        if [[ "${VASTLINT_ACTION_VERSION}" == "latest" ]]; then
          url="https://github.com/aleksUIX/vastlint/releases/latest/download/${artifact}"
        else
          url="https://github.com/aleksUIX/vastlint/releases/download/${VASTLINT_ACTION_VERSION}/${artifact}"
        fi

        mkdir -p "$RUNNER_TEMP/vastlint-bin"
        curl -fsSL "$url" -o "$RUNNER_TEMP/vastlint.tar.gz"
        tar -xzf "$RUNNER_TEMP/vastlint.tar.gz" -C "$RUNNER_TEMP/vastlint-bin"
        chmod +x "$RUNNER_TEMP/vastlint-bin/vastlint"
        echo "$RUNNER_TEMP/vastlint-bin" >> "$GITHUB_PATH"

    - name: Run vastlint check
      env:
        VASTLINT_ACTION_PATH: ${{ inputs.path }}
        VASTLINT_ACTION_WARNINGS: ${{ inputs.fail-on-warning }}
        VASTLINT_ACTION_FORMAT: ${{ inputs.format }}
        VASTLINT_ACTION_ARGS: ${{ inputs.extra-args }}
      shell: bash
      run: |
        set -euo pipefail

        cmd=(vastlint check "${VASTLINT_ACTION_PATH}" --no-color)

        if [[ "${VASTLINT_ACTION_WARNINGS}" == "true" ]]; then
          cmd+=(--fail-on-warning)
        fi

        if [[ -n "${VASTLINT_ACTION_FORMAT}" ]]; then
          cmd+=(--format "${VASTLINT_ACTION_FORMAT}")
        fi

        if [[ -n "${VASTLINT_ACTION_ARGS}" ]]; then
          read -r -a extra <<< "${VASTLINT_ACTION_ARGS}"
          cmd+=("${extra[@]}")
        fi

        "${cmd[@]}"
